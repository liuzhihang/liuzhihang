name: Refresh profile

on:
  schedule:
    - cron: '37 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    # A manual run on another branch must not push changes to the default branch.
    if: github.ref_name == github.event.repository.default_branch && github.repository == 'liuzhihang/liuzhihang'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Refresh blog and contribution visuals
        run: |
          python3 scripts/refresh_profile.py
          npm ci --ignore-scripts --no-audit --no-fund --prefix scripts
          cli=./scripts/node_modules/.bin/pacman-contribution-graph
          "$cli" --platform github --username liuzhihang --game pacman --gameTheme github --output assets/profile-arcade-light.svg
          "$cli" --platform github --username liuzhihang --game pacman --gameTheme github-dark --output assets/profile-arcade-dark.svg
          python3 scripts/refresh_profile.py --arcade-fallbacks
      - name: Commit and push if data changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- README.md assets/profile-skyline-{light,dark}.svg assets/profile-arcade-{light,dark}.svg assets/profile-arcade-still-{light,dark}.svg
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh public profile data'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.extraHeader=AUTHORIZATION: basic $auth" push origin "HEAD:$GITHUB_REF"
