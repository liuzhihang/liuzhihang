name: Refresh contribution arcade

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: write

concurrency:
  group: contribution-arcade
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check renderer and refresh public calendar
        run: |
          python3 -B -m unittest discover -s scripts -v
          python3 scripts/render_arcade.py --username liuzhihang --output assets/profile
      - name: Commit only changed arcade assets
        run: |
          git add -- assets/profile/arcade-light.svg assets/profile/arcade-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: refresh public contribution arcade'
          git push
